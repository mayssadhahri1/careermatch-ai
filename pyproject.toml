[project]
name = "careermatch-ai"
version = "1.0.0"
description = "Agent IA qui compare un CV à une offre de stage"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# Depends() et Query() en valeur par défaut est le style normal de FastAPI
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
